
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Store - Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .cart-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 35px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .cart-container h1 {
            color: #d63384;
        }

        .cart-item {
            padding: 15px;
            margin: 10px 0;
            background-color: #fff0f6;
            border: 1px solid #f5c2d7;
            border-radius: 8px;
        }

        .cart-total {
            color: #d63384;
            margin-top: 25px;
        }

        #cart-items {
            list-style: none;
            padding: 0;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <div class="logo">🌸 Flower Store</div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">🛒 Cart</a>
            <a href="login.html">Login</a>
            <a href="register.html">Sign-up</a>
            <a href="about.html">About Us</a>
        </nav>
    </header>

    <!-- Shopping Cart -->
    <main class="cart-container">

        <h1>🛒 Your Shopping Cart</h1>

        <p>Here are the flowers you selected.</p>

        <ul id="cart-items">
            <li>Your cart is empty.</li>
        </ul>

        <h2 class="cart-total">
            Total: <span id="cart-total">0</span> SAR
        </h2>

        <button class="btn" id="clearCartBtn" type="button">
            Clear Cart
        </button>

        <p>
            <a href="products.html" class="btn">
                Continue Shopping 🌸
            </a>
        </p>

    </main>

    <!-- Image Mapping -->
    <div style="text-align:center; margin:30px 0;">

        <h3>Click the image to visit About Us</h3>

        <img src="flower.jpg"
             alt="Flower Store"
             width="250"
             usemap="#workmap"
             style="border-radius:8px; box-shadow:0 4px 8px rgba(0,0,0,0.1);">

        <map name="workmap">
            <area shape="rect"
                  coords="0,0,250,250"
                  alt="About Us"
                  href="about.html">
        </map>
    </div>

    <!-- Footer -->
    <footer>
        <p>All Rights Reserved &copy; 2026</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
