<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Store - Sign-up</title>
    <link rel="stylesheet" href="css/style.css" />
    
    <!-- Embedded CSS -->
    <style>
        .form-container {
            max-width: 450px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Start of Header and Navigation Bar -->
    <header class="main-header">
        <div class="logo">🌸 Flower Store</div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">🛒 Cart</a>
            <a href="login.html">Login</a>
            <a href="register.html">Sign-up</a>
            <a href="about.html">About Us</a>
        </nav>
    </header>
    <!-- End of Header -->

    <!-- Register Form Container -->
    <div class="form-container">
        <h2 style="color: #d63384; margin-bottom: 20px;">Create a New Account</h2>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required />
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required />
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required />
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm your password" required />
            </div>

            <button type="submit" class="btn" style="width: 100%;">Sign-up</button>
        </form>

        <p style="margin-top: 15px; font-size: 14px;">
            Already have an account? <a href="login.html" style="color: #d63384;">Login here</a>
        </p>
    </div>

    <!-- Image Mapping Section (Requirement: Image and Image Mapping on every page) -->
    <div style="text-align: center; margin: 30px 0;">
        <img src="flower.jpg" alt="Flower Store" usemap="#workmap" width="250" style="border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <map name="workmap">
            <area shape="rect" coords="0,0,250,250" alt="About Us" href="about.html">
        </map>
    </div>

    <!-- Start of Footer -->
    <footer>
        <p>All Rights Reserved &copy; 2026</p>
    </footer>

<script src="js/script.js"></script>
</body>
</html>
